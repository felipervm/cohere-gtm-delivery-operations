name: Validate demo operations model
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_engine.cjs
      - run: node --check src/engine.js
      - run: node --check src/app.js
      - run: node --check src/gate-comparison.js
